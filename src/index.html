<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <!-- Defence in depth behind DOMPurify for rendered ticket bodies. 'unsafe-inline'
       stays for now because of the inline onclick handlers (see CONVENTIONS.md);
       eval, remote scripts and renderer network calls are blocked (Redmine is
       reached only via IPC). img-src keeps http(s): because images in ticket
       bodies that point at other hosts are deliberately left as plain <img>. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reddie</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="drag-handle-bar"></div>
  <div class="app-container">
    <header>
      <div class="header-left">
        <h1>Reddie</h1>
        <span id="connection-status" class="connection-status">
          <span class="status-dot"></span>
          <span class="status-text">Connecting…</span>
        </span>
      </div>
      <div class="header-right">
        <div class="board-mode-toggle">
          <button class="board-mode-btn active" data-mode="assigned" data-click="set-board-mode">My Issues</button>
          <button class="board-mode-btn" data-mode="authored" data-click="set-board-mode">Authored by Me</button>
        </div>
        <input type="text" id="board-search" class="board-search" placeholder="Search…" data-input="filter-board">
        <button class="new-ticket-btn" data-click="open-new-ticket"><span class="new-ticket-icon">+</span> New Ticket</button>
        <button class="theme-toggle" id="theme-toggle" data-click="toggle-theme">🌙</button>
        <button class="theme-toggle" id="transparency-toggle" data-click="toggle-transparency" title="Window transparency (macOS, restart required to apply)">👻</button>
        <button class="settings-btn" data-click="open-settings">⚙️</button>
      </div>
    </header>
    <main class="dashboard">
      <div class="column" id="backlog">
        <div class="column-header">
          <h2>Backlog</h2>
          <button class="add-btn" data-click="add-task" data-arg="backlog">+</button>
        </div>
        <div class="task-list" id="backlog-list"></div>
      </div>
      <div class="column" id="todo">
        <div class="column-header">
          <h2>To Do</h2>
          <button class="add-btn" data-click="add-task" data-arg="todo">+</button>
        </div>
        <div class="task-list" id="todo-list"></div>
      </div>
      <div class="column" id="in-progress">
        <div class="column-header">
          <h2>In Progress</h2>
          <button class="add-btn" data-click="add-task" data-arg="in-progress">+</button>
        </div>
        <div class="task-list" id="in-progress-list"></div>
      </div>
      <div class="column" id="done">
        <div class="column-header">
          <h2>Done</h2>
          <button class="add-btn" data-click="add-task" data-arg="done">+</button>
        </div>
        <div class="task-list" id="done-list"></div>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="close-btn" data-click="close-settings">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Redmine Base URL</label>
          <input type="text" id="redmine-base" placeholder="https://redmine.example.com">
        </div>
        <div class="form-group">
          <label>Redmine API Key</label>
          <input type="password" id="redmine-api-key" placeholder="Your API key">
        </div>
        <div class="form-group">
          <label>Text format</label>
          <select id="text-format">
            <option value="auto">Auto-detect</option>
            <option value="markdown">Markdown</option>
            <option value="textile">Textile</option>
          </select>
        </div>
        <div class="form-actions">
          <button data-click="save-settings">Save & Reconnect</button>
          <button type="button" class="secondary-btn" data-click="recover-timer">Recover saved timer…</button>
          <button type="button" class="secondary-btn" data-click="open-column-mapping">Column Mapping…</button>
          <button type="button" class="secondary-btn" data-click="check-for-updates">Check for Updates…</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Column Mapping Modal -->
  <div id="column-mapping-modal" class="modal">
    <div class="modal-content detail-modal-content">
      <div class="modal-header">
        <h2>Column Mapping</h2>
        <button class="close-btn" data-click="close-column-mapping">×</button>
      </div>
      <div class="modal-body detail-modal-body" id="column-mapping-body">
        <div class="detail-loading">Loading…</div>
      </div>
      <div class="detail-modal-footer">
        <button id="column-mapping-save-btn" class="comment-submit-btn" style="align-self: stretch;" data-click="save-column-mapping">Save mapping</button>
      </div>
    </div>
  </div>

  <!-- New Ticket Modal -->
  <div id="new-ticket-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>New Ticket</h2>
        <button class="close-btn" data-click="close-new-ticket">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Project</label>
          <select id="new-ticket-project" data-change="load-new-ticket-trackers"></select>
        </div>
        <div class="form-group">
          <label>Tracker</label>
          <select id="new-ticket-tracker" data-change="load-new-ticket-custom-fields"></select>
        </div>
        <div class="form-group">
          <label>Subject</label>
          <input type="text" id="new-ticket-subject" placeholder="What needs doing?">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="new-ticket-description" rows="4" placeholder="Optional details"></textarea>
        </div>
        <div id="new-ticket-custom-fields"></div>
        <div class="form-actions">
          <button id="new-ticket-submit-btn" data-click="submit-new-ticket">Create</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Issue Detail Modal -->
  <div id="issue-detail-modal" class="modal">
    <div class="modal-content detail-modal-content">
      <div class="modal-header">
        <h2 id="detail-subject" contenteditable="true" data-blur="save-subject" title="Click to edit the subject">Issue</h2>
        <button class="close-btn" data-click="close-issue-detail">×</button>
      </div>
      <div class="modal-body detail-modal-body" id="detail-body">
        <div class="detail-loading">Loading…</div>
      </div>
      <div class="detail-modal-footer">
        <textarea id="comment-input" class="comment-input" placeholder="Add a comment…" rows="3"></textarea>
        <button id="comment-submit-btn" class="comment-submit-btn" data-click="post-comment">Post comment</button>
      </div>
    </div>
  </div>

  <!-- Update Modal -->
  <div id="update-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Update Available</h2>
        <button class="close-btn" data-click="close-update-modal">×</button>
      </div>
      <div class="modal-body">
        <p id="update-modal-body"></p>
        <div class="form-actions">
          <button data-click="open-releases">Open GitHub Releases</button>
          <button type="button" class="secondary-btn" data-click="close-update-modal">Dismiss</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Loaded straight from node_modules (not copied into src/) so the version
       that runs is always the one package.json/bun.lock resolve, and
       Dependabot bumps actually reach the app. -->
  <script src="../node_modules/sortablejs/Sortable.min.js"></script>
  <script src="../node_modules/marked/lib/marked.umd.js"></script>
  <script src="../node_modules/textile-js/lib/textile.js"></script>
  <script src="../node_modules/dompurify/dist/purify.min.js"></script>
  <script src="urgency.js"></script>
  <script src="inline-images.js"></script>
  <script src="redmine-macros.js"></script>
  <script src="text-format.js"></script>
  <script src="timer.js"></script>
  <script src="issue-detail-helpers.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
